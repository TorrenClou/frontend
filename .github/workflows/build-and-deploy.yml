name: Build and Deploy

on:
  push:
    branches:
      - main
    # Release Please pushes these; without the trigger the semver tags below
    # can never be produced.
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Mirrors what the Dockerfile does, so a build that fails here would have failed
  # in Dokploy too — the point is to find that out before production is touched.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        # BACKEND_URL is deliberately absent. It is resolved per request by
        # app/proxy/[...path]/route.ts, so it is not needed to produce a build
        # and setting it here would imply otherwise.
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # This repo published no image at all, so there was nothing to pull for any
  # deployment that runs the frontend as its own service — which is what
  # Railway, Render and every split topology require. Only the all-in-one image
  # built in TorrenClou/deploy contained a frontend.
  image:
    name: Publish image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TorrenClou web
            org.opencontainers.image.description=TorrenClou web app — self-hosted torrent-to-cloud
            org.opencontainers.image.vendor=TorrenClou
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://tc.gitnasr.com
            org.opencontainers.image.documentation=https://tc.gitnasr.com/docs

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          platforms: linux/amd64,linux/arm64

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The frontend talks to the API on every page. Deploying it while the backend
      # is mid-rollout is what put a new UI in front of an old API before, so wait
      # for the API to answer first.
      #
      # This confirms the API is reachable, not that it is already running the
      # matching commit — the two repos deploy independently and nothing correlates
      # their versions. It closes the common window, not every one.
      - name: Wait for the API to be reachable
        env:
          API_HEALTH_URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "API_HEALTH_URL not set — skipping the readiness wait."
            exit 0
          fi

          for attempt in $(seq 1 30); do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "$API_HEALTH_URL" || echo 000)
            if [ "$status" = "200" ]; then
              echo "API healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: API returned ${status}, retrying in 10s..."
            sleep 10
          done

          # Deliberately non-fatal: a backend that is down is a reason to be careful,
          # not a reason to permanently block frontend deploys.
          echo "::warning::API did not become healthy in 5 minutes. Deploying anyway."

      - name: Trigger Dokploy deployment
        env:
          DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::DOKPLOY_DEPLOY_URL is not set. Add it as a repository secret."
            exit 1
          fi

          status=$(curl -sS -o /tmp/deploy.log -w '%{http_code}' -X POST "$DEPLOY_URL")
          echo "Dokploy responded $status"
          cat /tmp/deploy.log || true

          if [ "$status" != "200" ]; then
            echo "::error::Dokploy deploy webhook returned $status"
            exit 1
          fi

  # Was its own workflow on the same push:main trigger, so it raced this one and
  # the combined image could be rebuilt from a commit that had just failed to
  # build here. Gated on the image job now.
  dispatch-combined:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger combined image build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          repository: TorrenClou/deploy
          event-type: build-combined
          client-payload: |
            {
              "repository": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}"
            }
