name: Build and Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Type Check
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      bump: ${{ steps.version.outputs.bump }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail

          pkg_version=$(jq -r '.version // "2.1.0"' package.json | tr -d '[:space:]')
          [ -z "$pkg_version" ] && pkg_version="2.1.0"

          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          tag_version="${latest_tag#v}"

          if [ -n "$tag_version" ]; then
            base_version=$(printf '%s\n%s\n' "$pkg_version" "$tag_version" | sort -V | tail -n1)
          else
            base_version="$pkg_version"
          fi

          IFS='.' read -r major minor patch <<< "$base_version"

          if [ -n "$latest_tag" ] && git merge-base --is-ancestor "$latest_tag" HEAD 2>/dev/null; then
            range="${latest_tag}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi

          head_subj=$(git log -1 --format="%s")
          changed_non_docs=$(git diff --name-only HEAD~1..HEAD 2>/dev/null | grep -vE '(\.md$|^docs/)' || true)

          should_release="true"
          if [ "${{ github.event_name }}" = "push" ]; then
            if echo "$head_subj" | grep -qE '^docs(\([^)]+\))?:' || [ -z "$changed_non_docs" ]; then
              should_release="false"
            fi
          fi

          commits_full=$(git log $range --format="%s%n%b" 2>/dev/null || git log -1 --format="%s%n%b")
          commits_subj=$(git log $range --format="%s" 2>/dev/null || git log -1 --format="%s")

          if echo "$commits_full" | grep -qE '(BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:)'; then
            major=$((major + 1))
            minor=0
            patch=0
            bump="major"
          elif echo "$commits_subj" | grep -qE '^feat(\([^)]+\))?:'; then
            minor=$((minor + 1))
            patch=0
            bump="minor"
          else
            patch=$((patch + 1))
            bump="patch"
          fi

          version="${major}.${minor}.${patch}"
          major_minor="${major}.${minor}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${major_minor}" >> "$GITHUB_OUTPUT"
          echo "bump=${bump}" >> "$GITHUB_OUTPUT"
          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "Computed next version: ${version} (bump: ${bump}, should_release: ${should_release}, base: ${base_version}, latest tag: ${latest_tag:-none})"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  image:
    name: Build ${{ matrix.arch }}
    needs: build
    if: (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) && (github.event_name == 'pull_request' || needs.build.outputs.should_release == 'true')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")/web" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish and Release v${{ needs.build.outputs.version }}
    needs: [build, image]
    if: github.event_name != 'pull_request' && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) && needs.build.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.build.outputs.version }},enable={{is_default_branch}}
            type=raw,value=${{ needs.build.outputs.major_minor }},enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TorrentDrive web
            org.opencontainers.image.description=TorrentDrive web app — self-hosted torrent-to-cloud
            org.opencontainers.image.vendor=TorrentDrive
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://tc.gitnasr.com
            org.opencontainers.image.documentation=https://tc.gitnasr.com/docs

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")/web"

          refs=""
          for digest in *; do
            refs="${refs} ${image}@sha256:${digest}"
          done
          echo "Merging:${refs}"

          tags=""
          while read -r tag; do
            [ -n "$tag" ] && tags="${tags} --tag ${tag}"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx imagetools create ${tags} ${refs}
          docker buildx imagetools inspect "${image}:latest" || true

      - name: Checkout code for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version, tag, and create GitHub Release
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          today=$(date -u +%Y-%m-%d)

          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -n "$latest_tag" ] && git merge-base --is-ancestor "$latest_tag" HEAD 2>/dev/null; then
            notes=$(git log "${latest_tag}..HEAD" --no-merges --pretty=format:"* %s (%h)" | grep -v '^. chore(release):' || true)
          else
            notes=$(git log -1 --pretty=format:"* %s (%h)")
          fi
          [ -z "$notes" ] && notes="* Maintenance release (${GITHUB_SHA:0:7})"

          npm pkg set version="${version}"
          if [ -f package-lock.json ]; then
            jq --arg v "${version}" '.version = $v | if .packages[""] then .packages[""].version = $v else . end' package-lock.json > package-lock.json.tmp
            mv package-lock.json.tmp package-lock.json
          fi

          {
            echo "# Changelog"
            echo ""
            echo "## [${version}] - ${today}"
            echo ""
            echo "${notes}"
            echo ""
            if [ -f CHANGELOG.md ]; then
              tr -d '\r' < CHANGELOG.md | sed '1{/^# Changelog/d;}' | sed '/./,$!d'
            fi
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

          printf '%s\n' "$notes" > /tmp/release-notes.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): v${version} [skip ci]"
          git pull --rebase origin main
          release_sha=$(git rev-parse HEAD)
          git push origin HEAD:main

          git tag -f "v${version}" "$release_sha"
          git push -f origin "v${version}"

          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

          gh release create "v${version}" \
            --target "$release_sha" \
            --title "v${version}" \
            --notes-file /tmp/release-notes.md || true

      - name: Notify the deploy webhook, if configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "No DEPLOY_WEBHOOK_URL secret set - nothing to notify."
            exit 0
          fi

          status=$(curl -sS -L -o /tmp/deploy.log -w '%{http_code}' -X POST "${DEPLOY_WEBHOOK_URL}" || echo 000)
          echo "Webhook responded ${status}"
          cat /tmp/deploy.log 2>/dev/null || true

          case "${status}" in
            2*) echo "Deploy triggered." ;;
            *)  echo "::warning::Deploy webhook returned ${status}. The image and release published successfully; only the redeploy notification failed." ;;
          esac

      - name: Trigger combined image build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DEPLOY_PAT secret is not configured; skipping cross-repo repository_dispatch."
            exit 0
          fi

          version="${{ needs.build.outputs.version }}"
          bump="${{ needs.build.outputs.bump }}"
          sha="${{ steps.publish.outputs.release_sha }}"

          if gh api repos/TorrentDrive/deploy/dispatches \
            --method POST \
            -f event_type="build-combined" \
            -f "client_payload[repository]=${GITHUB_REPOSITORY}" \
            -f "client_payload[sha]=${sha}" \
            -f "client_payload[ref]=v${version}" \
            -f "client_payload[bump]=${bump}" \
            -f "client_payload[actor]=${GITHUB_ACTOR}"; then
            echo "Dispatched build-combined to TorrentDrive/deploy for v${version} (${sha}, bump=${bump})."
          else
            echo "::warning::Failed to dispatch build-combined to TorrentDrive/deploy. Check DEPLOY_PAT permissions."
          fi
