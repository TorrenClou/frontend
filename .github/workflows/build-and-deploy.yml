name: Build and Publish

on:
  push:
    branches:
      - main
    # Fires only for a tag pushed by a human. Release Please tags with
    # GITHUB_TOKEN, and GitHub does not start runs from that token's events —
    # see the tag-release job for how automated releases get their semver tags.
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Mirrors what the Dockerfile does, so a compile or type error surfaces here
  # rather than partway through building the image.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        # BACKEND_URL is deliberately absent. It is resolved per request by
        # app/proxy/[...path]/route.ts, so it is not needed to produce a build
        # and setting it here would imply otherwise.
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # This repo published no image at all, so there was nothing to pull for any
  # deployment that runs the frontend as its own service — which is what
  # Railway, Render and every split topology require. Only the all-in-one image
  # built in TorrenClou/deploy contained a frontend.
  # Each architecture builds on a runner of that architecture.
  #
  # This was one job emulating arm64 through QEMU, which took around 17 minutes
  # of the roughly 19 this workflow spent. ubuntu-24.04-arm is free for public
  # repositories, so both now build natively and in parallel.
  #
  # Each pushes by digest with no tag; the merge job below assembles the two
  # digests into one manifest list and puts the tags on that, which also means a
  # tag can never end up pointing at a single architecture.
  image:
    name: Build ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")/web" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Export the digest
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=TorrenClou web
            org.opencontainers.image.description=TorrenClou web app — self-hosted torrent-to-cloud
            org.opencontainers.image.vendor=TorrenClou
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://tc.gitnasr.com
            org.opencontainers.image.documentation=https://tc.gitnasr.com/docs

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")/web"

          refs=""
          for digest in *; do
            refs="${refs} ${image}@sha256:${digest}"
          done
          echo "Merging:${refs}"

          tags=""
          while read -r tag; do
            [ -n "$tag" ] && tags="${tags} --tag ${tag}"
          done <<< "${{ steps.meta.outputs.tags }}"

          docker buildx imagetools create ${tags} ${refs}
          docker buildx imagetools inspect "${image}:latest" || true


  # Optional, and provider-agnostic.
  #
  # This used to wait on a Dokploy health URL and then POST to a hardcoded
  # Dokploy webhook, failing the whole workflow when the secret was missing or
  # the response was not exactly 200. It had been failing every push to main
  # with "Branch Not Match" (301), which made good builds look broken.
  #
  # TorrenClou is not tied to one host. This repo publishes an image; Dokploy,
  # Coolify, Railway, Render and a plain docker host all pull it, and most
  # redeploy on their own.
  #
  # It never fails the workflow: by the time it runs the image is published and
  # the build genuinely succeeded, so a webhook that is misconfigured or briefly
  # down is not a reason to mark that build red.
  notify-deploy:
    needs: merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify the deploy webhook, if one is configured
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          set -uo pipefail

          if [ -z "${DEPLOY_WEBHOOK_URL}" ]; then
            echo "No DEPLOY_WEBHOOK_URL secret set - nothing to notify."
            echo "The image is published; most platforms redeploy by pulling it."
            exit 0
          fi

          status=$(curl -sS -L -o /tmp/deploy.log -w '%{http_code}'             -X POST "${DEPLOY_WEBHOOK_URL}" || echo 000)
          echo "Webhook responded ${status}"
          cat /tmp/deploy.log 2>/dev/null || true

          case "${status}" in
            2*) echo "Deploy triggered." ;;
            *)  echo "::warning::Deploy webhook returned ${status}. The image published successfully; only the redeploy notification failed." ;;
          esac


  # Was its own workflow on the same push:main trigger, so it raced this one and
  # the combined image could be rebuilt from a commit that had just failed to
  # build here. Gated on the image job now.
  dispatch-combined:
    needs: merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger combined image build
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          repository: TorrenClou/deploy
          event-type: build-combined
          client-payload: |
            {
              "repository": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}"
            }

  # Applies the semver tags to a release build.
  #
  # The tag trigger above cannot do this on its own. Release Please creates its
  # tag with GITHUB_TOKEN, and GitHub deliberately does not start workflow runs
  # from events raised by that token, so `on: push: tags` never fires for an
  # automated release. Verified the hard way: backend v1.1.0 was tagged and
  # released, and zero workflow runs started for that tag.
  #
  # This runs in the same workflow as the build it is tagging, so the image
  # already exists, and re-tags it by digest — no rebuild, and the semver tag
  # points at exactly the artifact that was built for that commit.
  tag-release:
    needs: merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Is this a release commit?
        id: release
        run: |
          set -euo pipefail
          # Release Please touches the manifest and nothing else does.
          if git diff --name-only HEAD^ HEAD | grep -qx '.release-please-manifest.json'; then
            version=$(jq -r '.["."]' .release-please-manifest.json)
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "major_minor=${version%.*}" >> "$GITHUB_OUTPUT"
            echo "Release commit for ${version}"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit; nothing to tag."
          fi

      - name: Log in to GitHub Container Registry
        if: steps.release.outputs.is_release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply semver tags
        if: steps.release.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          # github.repository preserves the owner's casing ("TorrenClou/frontend"),
          # and Docker rejects an uppercase repository name. The build job above
          # never hit this because docker/metadata-action lowercases for you.
          image="ghcr.io/$(echo "${{ github.repository }}" | tr "[:upper:]" "[:lower:]")/web"
          version="${{ steps.release.outputs.version }}"
          major_minor="${{ steps.release.outputs.major_minor }}"
          echo "Tagging ${image} as ${version} and ${major_minor}"
          docker buildx imagetools create \
            --tag "${image}:${version}" \
            --tag "${image}:${major_minor}" \
            "${image}:sha-${{ github.sha }}"

